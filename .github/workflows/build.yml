name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Fetch KeePass to build against
        shell: pwsh
        run: ./scripts/fetch-keepass.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Test and package
        shell: pwsh
        run: ./scripts/package.ps1 -Installer -Tag "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: keepass-fido2
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: keepass-fido2
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" dist/*
          --repo "${{ github.repository }}"
          --title "KeePass FIDO2 ${{ github.ref_name }}"
          --generate-notes
          --prerelease
